  <script src="https://cdn.tailwindcss.com"></script>

<body class="min-h-screen pb-16">

  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-30">

      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <span id="data-badge" class="px-2.5 py-0.5 text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full nowrap">⚠️ 依韓服數據・台服待確認</span>

const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('zh-TW');
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
}
const groupById = id => CONFIG.groups.find(g => g.id === id);
const key = (stageId, itemId) => `${stageId}:${itemId}`;
function cleanId(raw) {
  const id = String(raw || '').replace(/[\u0000-\u001F\u007F]/g, '').trim();
  if (!id) return { error: '請輸入遊戲 ID' };
  if (id.length > MAX_ID_LEN) return { error: `遊戲 ID 最多 ${MAX_ID_LEN} 個字` };
  if (/^[=+\-@]/.test(id)) return { error: '遊戲 ID 不能以 = + - @ 開頭' };
  return { id };
}
function timeText(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const pct = (a, b) => b > 0 ? Math.min(100, Math.floor(a / b * 100)) : 0;
const VERIFY_BADGE = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 nowrap align-middle">待確認</span>';

/* 依配方把交付品往下拆成「加工批數」與「底層原料」（不計大成功）。
 * needs = { '合金鋼錠': 900, ... }，回傳 { crafts: {產物: 批數}, raw: {原料: 數量} } */
function expandNeeds(needs) {
  const R = CONFIG.recipes;
  const need = { ...needs };
  const crafts = {};
  for (let guard = 0; guard < 100; guard++) {
    const pending = Object.keys(need).filter(p => R[p] && need[p] > 0);
    // 先處理「沒有被其他待處理產物當作原料」的產物（由上往下拆，與 calc.py 相同）
    const p = pending.find(x => !pending.some(q => q !== x && R[q].in[x]));
    if (!p) break;
    const batches = Math.ceil(need[p] / R[p].out);
    crafts[p] = batches;
    for (const [k, v] of Object.entries(R[p].in)) need[k] = (need[k] || 0) + v * batches;
    delete need[p];
  }
  const raw = {};
  for (const [k, v] of Object.entries(need)) if (v > 0 && !R[k]) raw[k] = v;
  return { crafts, raw };
}
// 某交付品的加工鏈上用到的所有配方名稱
function chainOf(name, out = []) {
  const r = CONFIG.recipes[name];
  if (!r || out.includes(name)) return out;
  out.push(name);
  Object.keys(r.in).forEach(k => chainOf(k, out));
  return out;
}

/* ---------- 計算 ---------- */
function computed() {
  const totals = {};
  const claimed = { A: [], B: [], C: [], D: [] };
  for (const m of state.members) {
    if (claimed[m.group]) claimed[m.group].push(m);
    for (const [k, v] of Object.entries(m.reports || {})) totals[k] = (totals[k] || 0) + (Number(v) || 0);
  }
  // 每組有效人數：有人認領用實際人數，否則用建議人數估算
  const heads = {};
  for (const g of CONFIG.groups) {
    const n = claimed[g.id].length;
    heads[g.id] = { n: n || g.plannedMembers, real: n > 0 };
  }
  const stages = CONFIG.stages.map(s => {
    let got = 0, need = 0;
    const rows = s.needs.map(nd => {
      const item = CONFIG.items[nd.item];
      const have = totals[key(s.id, nd.item)] || 0;
      got += Math.min(have, nd.qty); need += nd.qty;
      return { ...nd, item, itemId: nd.item, have, quota: Math.ceil(nd.qty / heads[item.group].n), pct: pct(have, nd.qty) };
    });
    return { ...s, rows, pct: pct(got, need), done: got >= need };
  });
  const current = stages.find(s => !s.done);
  return { totals, claimed, heads, stages, currentId: current ? current.id : null };
}

  ].map(([id, group, reports]) => ({ id, group, reports, updatedAt: now }));

async function apiGet() {
  if (DEMO) { await new Promise(r => setTimeout(r, 150)); return { ok: true, members: demoDb() }; }
  const res = await fetch(`${API_URL}${API_URL.includes('?') ? '&' : '?'}t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
  if (!res.ok) throw new Error(`伺服器回應 ${res.status}`);
  return res.json();
}

async function apiPost(body) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 200));
    const db = demoDb();
    const lower = body.id.toLowerCase();
    let i = db.findIndex(m => m.id.toLowerCase() === lower);
    if (body.action === 'delete') { if (i >= 0) db.splice(i, 1); }
    else {
      if (i < 0) { db.push({ id: body.id, group: '', reports: {}, updatedAt: '' }); i = db.length - 1; }
      const m = db[i];
      if ('group' in body) m.group = body.group;
      if (body.reports) for (const [k, v] of Object.entries(body.reports)) { if (v > 0) m.reports[k] = v; else delete m.reports[k]; }
      m.updatedAt = new Date().toISOString();
    }
    localStorage.setItem(LS_DEMO, JSON.stringify(db));
    return { ok: true, members: db };
  }
  // text/plain = 「簡單請求」，不會觸發 CORS 預檢；Apps Script 會 302 轉址，fetch 會自動跟隨
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`伺服器回應 ${res.status}`);
  return res.json();
}

function acceptData(data) {
  if (!data || !data.ok) throw new Error((data && data.error) || '資料格式錯誤');
  state.members = (data.members || []).filter(m => m && m.id).map(m => ({
    id: String(m.id), group: ['A', 'B', 'C', 'D'].includes(m.group) ? m.group : '',
    reports: m.reports && typeof m.reports === 'object' ? m.reports : {}, updatedAt: m.updatedAt || ''
  }));
  state.loaded = true; state.error = ''; state.lastSync = new Date();
}

async function refresh() {
  if (state.loading || state.saving) return;
  state.loading = true; renderStatus();
  try { acceptData(await apiGet()); }
  catch (e) { state.error = `讀取失敗：${e.message || e}（請檢查網路或 API 網址）`; }
  state.loading = false;
  renderAll();
}

async function save(body, okMsg) {
  state.saving = true; state.flash = ''; renderStatus(); renderMine();
  try {
    acceptData(await apiPost(body));
    state.dirty = false; state.flash = okMsg || '✅ 已儲存';
  } catch (e) {
    state.flash = `❌ 儲存失敗：${e.message || e}`;
  }
  state.saving = false;
  renderAll();
}

function renderStatus() {
  const s = $('sync-status');
  if (state.saving) s.textContent = '儲存中…';

  else if (state.lastSync) s.textContent = `${DEMO ? '示範資料' : '已同步'} ${timeText(state.lastSync.toISOString())}`;
  else s.textContent = '';
  $('refresh-btn').disabled = state.loading || state.saving;
  $('refresh-btn').classList.toggle('opacity-50', state.loading || state.saving);
  $('demo-banner').classList.toggle('hidden', !DEMO);

    const recipeHtml = recipeNames.map(n => {
      const rc = CONFIG.recipes[n];
      return `<div class="py-1.5 border-b border-slate-800/80 last:border-0 text-xs">
        <div class="flex flex-wrap justify-between gap-x-2"><span class="font-bold text-slate-200">${esc(n)} ×${rc.out} ${rc.verify ? VERIFY_BADGE : ''}</span><span class="text-slate-500 nowrap">${esc(rc.station)}・${esc(rc.time)}</span></div>
        <div class="text-slate-400">← ${Object.entries(rc.in).map(([k, v]) => `${esc(k)} ${fmt(v)}`).join(' + ')}</div>
        ${rc.verify ? `<div class="text-amber-300/80 text-[11px]">⚠️ ${esc(rc.verify)}</div>` : ''}
      </div>`;
    }).join('');

    const chips = members.length
      ? members.map(m => `<span class="px-2 py-0.5 rounded-full bg-white/10 border border-white/15 text-xs text-white break-all">${esc(m.id)}</span>`).join('')
      : '<span class="text-xs text-slate-400">尚無人認領，快來當第一個！</span>';

    return `<article class="bg-slate-900/90 border ${col.border} ${col.glow} rounded-2xl overflow-hidden flex flex-col">
      <div class="bg-gradient-to-r ${col.head} p-4 md:p-5 border-b border-slate-800">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0"><span class="text-2xl">${g.icon}</span><h3 class="text-xl font-black text-white">${g.id}組：${esc(g.name)}</h3></div>
          <span class="px-3 py-1 rounded-full text-xs font-black bg-white/10 text-white border border-white/15 nowrap">已認領 ${members.length} 人・建議 ${g.plannedMembers} 人</span>
        </div>
        <p class="text-xs md:text-sm text-slate-300 mt-2">${esc(g.tagline)}</p>
        <div class="mt-3 bg-black/30 border border-white/10 rounded-xl p-2.5 text-xs text-amber-200">💡 <strong>組員行動指南：</strong>${esc(g.actionGuide)}</div>
        <div class="mt-3 flex flex-wrap gap-1.5">${chips}</div>
      </div>
      <div class="p-4 md:p-5 space-y-3 flex-1">
        ${stageBlocks}
        <details data-det="recipes-${g.id}" ${state.openDet.has('recipes-' + g.id) ? 'open' : ''} class="bg-slate-900/70 rounded-lg border border-slate-800/90 px-3 py-2">
          <summary class="text-xs font-bold text-slate-300"><span class="chev">▶</span> 📖 本組配方表（每批投入 → 產出，時間為無生活會員）</summary>
          <div class="mt-1">${recipeHtml}</div>
        </details>
      </div>
    </article>`;
  }).join('');
}

/* ---------- 畫面：名單 ---------- */
function renderRoster() {
  const q = $('roster-search').value.trim().toLowerCase();
  const list = state.members.filter(m => !q || m.id.toLowerCase().includes(q));
  $('roster-count').textContent = `（共 ${state.members.length} 人）`;
  const sections = [...CONFIG.groups.map(g => ({ id: g.id, title: `${g.icon} ${g.id}組 ${g.name}`, color: COLORS[g.color].soft })), { id: '', title: '❔ 尚未認領', color: 'text-slate-400' }];
  const html = sections.map(sec => {
    const ms = list.filter(m => m.group === sec.id).sort((a, b) => a.id.localeCompare(b.id, 'zh-TW'));
    if (!ms.length) return '';
    return `<div>
      <div class="text-sm font-bold ${sec.color} mb-1.5">${esc(sec.title)}（${ms.length}）</div>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">${ms.map(m => {
        const entries = CONFIG.stages.flatMap(s => s.needs.map(n => [s, n])).filter(([s, n]) => m.reports[key(s.id, n.item)] > 0);
        const chips = entries.length ? entries.map(([s, n]) => `<span class="nowrap">${esc(s.id)} ${esc(CONFIG.items[n.item].name)} <b class="text-slate-100">${fmt(m.reports[key(s.id, n.item)])}</b></span>`).join('<span class="text-slate-600">・</span>') : '<span class="text-slate-500">尚未回報</span>';
        const isMe = state.meId && m.id.toLowerCase() === state.meId.toLowerCase();
        return `<div class="bg-slate-900/80 border ${isMe ? 'border-indigo-500/60' : 'border-slate-800'} rounded-xl px-3 py-2">
          <div class="flex justify-between gap-2"><span class="font-bold text-white break-all">${esc(m.id)}${isMe ? ' <span class="text-xs text-indigo-300">（我）</span>' : ''}</span><span class="text-[11px] text-slate-500 nowrap">${esc(timeText(m.updatedAt))}</span></div>
          <div class="text-xs text-slate-400 mt-0.5 flex flex-wrap gap-x-1">${chips}</div>
        </div>`;
      }).join('')}</div></div>`;
  }).join('');
  $('roster').innerHTML = html || `<p class="text-sm text-slate-400">${q ? '找不到符合的 ID' : (state.loaded ? '還沒有人認領，成為第一個吧！' : '載入中…')}</p>`;
}

function renderAll() {
  syncDraft();
  renderStatus(); renderMine(); renderStages(); renderFilters(); renderGroups(); renderRoster();
}

/* ---------- 公告 ---------- */
function buildAnnouncement() {
  const c = computed();
  const L = [];
  const total = state.members.filter(m => m.group).length;
  L.push(`🚢【公會船第二階段・專責分組作戰】🚢（目前已認領 ${total} 人）`);
  L.push('每人認領一組，專心搞定該組責任額！認領與回報請到看板：');
  L.push(location.href.split('#')[0]);
  L.push('');
  L.push('🏗️【施工進度】');
  c.stages.forEach(s => L.push(`  ${s.id} ${s.name}：${s.pct}%${s.done ? ' ✅' : s.id === c.currentId ? ' 🔥進行中' : ''}`));
  L.push('');
  CONFIG.groups.forEach(g => {
    const h = c.heads[g.id];
    L.push(`${g.icon}【${g.id}組：${g.name}】（${h.real ? `已認領 ${h.n} 人` : `尚無人認領，以 ${h.n} 人估算`}）`);
    L.push(`▸ 行動重點：${g.actionGuide}`);
    c.stages.forEach(s => s.rows.filter(r => r.item.group === g.id).forEach(r => {
      L.push(`  • [${s.id}] ${r.item.name}：每人 ${fmt(r.quota)} 個（全會 ${fmt(r.have)}/${fmt(r.qty)}）`);
      const raw = expandNeeds({ [r.item.name]: r.qty }).raw;
      L.push(`      每人原料約：${Object.entries(raw).map(([k, v]) => `${k} ${fmt(Math.ceil(v / h.n))}`).join('、')}`);
    }));
    L.push('');
  });
  L.push('📌【提醒】');
  L.push('1. 施工順序 2-1 ➔ 2-2 ➔ 2-3 ➔ 2-4，A組(木材+)、B組(鋼錠/焦油) 請優先繳交 2-1 材料！');
  const allNeeds = {};
  CONFIG.stages.forEach(st => st.needs.forEach(n => { const nm = CONFIG.items[n.item].name; allNeeds[nm] = (allNeeds[nm] || 0) + n.qty; }));
  const wax = expandNeeds(allNeeds).raw['蜂蠟'] || 0;
  L.push(`2. 蜂蠟共需約 ${fmt(wax)} 個（厚布料＋繩索），雜貨店每角色每週限購 30 個，請全公會每週買滿支援 C 組！`);
  L.push('3. D組：壯壯蘑菇汁液、魔力藥草可向麗莎／馬努斯購買，每週各 30 次，記得買滿。');
  L.push('4. 交完材料記得到看板更新「累計已交數量」，大家才看得到進度。');
  if (CONFIG.DATA_STATUS !== '已核實') L.push(`※ 數量${CONFIG.DATA_STATUS}，以遊戲內顯示為準；原料未計大成功。`);
  return L.join('\n');
}
let lastFocus = null;
function openModal() {
  lastFocus = document.activeElement;
  $('announce-text').value = buildAnnouncement();
  $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
  document.body.classList.add('modal-open');
  $('copy-btn').focus();
}
function closeModal() {
  $('modal').classList.add('hidden'); $('modal').classList.remove('flex');
  document.body.classList.remove('modal-open');
  if (lastFocus) lastFocus.focus();
}
async function copyAnnouncement() {
  const ta = $('announce-text'); const btn = $('copy-btn');
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.select(); try { document.execCommand('copy'); } catch (e2) {} }
  btn.textContent = '✅ 已複製！';
  setTimeout(() => { btn.textContent = '📋 複製公告文字'; }, 2000);
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target === $('modal')) closeModal();   // 點背景關閉
    return;
  }
  const act = el.dataset.act;
  if (act === 'open-modal') openModal();
  else if (act === 'close-modal') closeModal();
  else if (act === 'copy') copyAnnouncement();
  else if (act === 'refresh') refresh();
  else if (act === 'filter') { state.filter = el.dataset.filter; renderFilters(); renderGroups(); }
  else if (act === 'claim') {
    if (state.saving) return;
    const gid = el.dataset.group;
    const me = myRecord();
    if (me && me.group === gid) return;
    if (gid === '' && !confirm('確定要取消認領嗎？（已回報的數量會保留）')) return;
    save({ action: 'upsert', id: state.meId, group: gid }, gid ? `✅ 已認領 ${gid} 組` : '已取消認領');
  }
  else if (act === 'fill' || act === 'zero') {
    state.draft[el.dataset.key] = act === 'fill' ? Number(el.dataset.quota) : 0;
    state.dirty = true; state.flash = ''; renderMine();
  }
  else if (act === 'save') {
    if (state.saving) return;
    const reports = {};
    for (const s of CONFIG.stages) for (const n of s.needs) {
      const k = key(s.id, n.item);
      const v = Number(state.draft[k] || 0);
      if (!Number.isInteger(v) || v < 0 || v > 1000000) { state.flash = '❌ 數量必須是 0～1,000,000 的整數'; renderMine(); return; }
      reports[k] = v;
    }
    save({ action: 'upsert', id: state.meId, reports }, '✅ 回報已儲存');
  }
  else if (act === 'switch-id') {
    if (state.dirty && !confirm('有尚未儲存的變更，確定切換？')) return;
    state.meId = ''; localStorage.removeItem(LS_ME); state.dirty = false; state.flash = ''; renderAll();
  }
  else if (act === 'delete-me') {
    if (!confirm(`確定要刪除「${state.meId}」的認領與回報紀錄嗎？此動作無法復原。`)) return;
    state.dirty = false;
    save({ action: 'delete', id: state.meId }, '已刪除紀錄');
  }
  else if (act === 'demo-reset') {
    if (!confirm('重設示範資料？')) return;
    localStorage.removeItem(LS_DEMO); state.dirty = false; refresh();
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('[data-act=show-all]')) { state.showAll = e.target.checked; renderMine(); }
  else if (e.target.matches('#mine input[type=number]')) {
    // 失焦或按 Enter 後才重繪（顯示已達標標記）
    setTimeout(renderMine, 0);
  }
});

document.addEventListener('input', e => {
  if (e.target.matches('#mine input[type=number]')) {
    const raw = e.target.value;
    let v = raw === '' ? 0 : Math.floor(Number(raw));
    if (!isFinite(v) || v < 0) v = 0;
    if (v > 1000000) v = 1000000;
    state.draft[e.target.dataset.key] = v;
    state.dirty = true; state.flash = '';
  } else if (e.target.id === 'roster-search') renderRoster();
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'id-form') return;
  e.preventDefault();
  const r = cleanId($('id-input').value);
  if (r.error) { $('id-error').textContent = r.error; return; }
  // 若名單中已有同名（大小寫不同），沿用名單上的寫法
  const exist = state.members.find(m => m.id.toLowerCase() === r.id.toLowerCase());
  state.meId = exist ? exist.id : r.id;
  localStorage.setItem(LS_ME, state.meId);
  state.dirty = false; state.flash = exist ? `歡迎回來，${state.meId}！` : '';
  renderAll();
});

document.addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.det;
  if (id) { if (e.target.open) state.openDet.add(id); else state.openDet.delete(id); }
}, true);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal();
});

window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

// 自動更新：每 45 秒；切到背景暫停，回到前景立即更新
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.lastSync && Date.now() - state.lastSync.getTime() > 15000) refresh();
});

renderAll();
refresh();
</script>
</body>
</html>
