<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <title>諸神降臨｜瑪奇 Mobile 公會船第二階段認領看板</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    :root {
      --bg: #0b1120;
      --line: rgba(148, 163, 184, .13);
      --line-strong: rgba(148, 163, 184, .22);
      --text: #e5e9f0;
      --muted: #94a3b8;
      --faint: #64748b;
      --primary: #6d7fd6;
      --ok: #7fbf9f;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Noto Sans TC', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 520px at 8% -8%, rgba(70, 94, 140, .22), transparent 70%),
        radial-gradient(900px 480px at 100% 0%, rgba(96, 78, 130, .14), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      letter-spacing: .01em;
    }
    .num { font-variant-numeric: tabular-nums; }
    .nowrap { white-space: nowrap; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }

    .card {
      background: linear-gradient(180deg, rgba(30, 41, 62, .58), rgba(16, 23, 38, .58));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035), 0 12px 32px -20px rgba(0, 0, 0, .7);
    }
    .sub {
      background: rgba(12, 18, 32, .55);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .sub.done { border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--faint); }
    .sec-title { font-size: 1.05rem; font-weight: 700; color: #f1f5f9; }

    /* 組別／階段強調色：在元素上設定 --ac */
    .ac-text { color: color-mix(in srgb, var(--ac) 88%, white); }
    .ac-dot { width: 8px; height: 8px; border-radius: 9999px; background: var(--ac); display: inline-block; flex: none; }
    .chip {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: 2px 9px; border-radius: 9999px; font-size: 11px; font-weight: 700;
      background: rgba(148, 163, 184, .08); border: 1px solid var(--line); color: #cbd5e1;
    }
    .chip-ac {
      background: color-mix(in srgb, var(--ac) 13%, transparent);
      border-color: color-mix(in srgb, var(--ac) 30%, transparent);
      color: color-mix(in srgb, var(--ac) 80%, white);
    }
    .chip-ok { background: rgba(127, 191, 159, .13); border-color: rgba(127, 191, 159, .32); color: #a7d7bf; }
    .chip-warn { background: rgba(214, 170, 100, .12); border-color: rgba(214, 170, 100, .3); color: #e2c38f; }
    .group-head { background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 13%, transparent), transparent 65%); }
    .accent-top { box-shadow: inset 0 2px 0 color-mix(in srgb, var(--ac) 55%, transparent); }

    .bar { height: 6px; border-radius: 9999px; background: rgba(148, 163, 184, .12); overflow: hidden; }
    .bar.thin { height: 4px; }
    .bar > i {
      display: block; height: 100%; border-radius: 9999px; transition: width .5s ease;
      background: linear-gradient(90deg, color-mix(in srgb, var(--ac) 55%, #0b1120), var(--ac));
    }

    .btn { border-radius: 12px; font-weight: 700; font-size: .875rem; transition: background .15s, border-color .15s, opacity .15s; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: linear-gradient(180deg, #6f80d6, #5867b8); color: #fff; box-shadow: 0 6px 18px -10px rgba(88, 103, 184, .9); }
    .btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #7b8bdc, #6170c0); }
    .btn-ghost { background: rgba(148, 163, 184, .07); border: 1px solid var(--line); color: #cbd5e1; }
    .btn-ghost:hover:not(:disabled) { background: rgba(148, 163, 184, .13); }
    .btn-sm { padding: .45rem .7rem; font-size: .75rem; border-radius: 10px; }

    .pick { border: 1px solid var(--line); background: rgba(12, 18, 32, .5); border-radius: 14px; transition: border-color .15s, background .15s; }
    .pick:hover:not(:disabled) { border-color: var(--line-strong); }
    .pick.on {
      border-color: color-mix(in srgb, var(--ac) 55%, transparent);
      background: color-mix(in srgb, var(--ac) 14%, rgba(12, 18, 32, .5));
    }
    .field {
      background: rgba(8, 13, 24, .75); border: 1px solid var(--line-strong); border-radius: 10px; color: #f1f5f9;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .field:focus { border-color: rgba(109, 127, 214, .7); box-shadow: 0 0 0 3px rgba(109, 127, 214, .18); }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    .tab { padding: .4rem .75rem; border-radius: 9px; font-size: .75rem; font-weight: 700; color: var(--muted); }
    .tab.on { background: rgba(109, 127, 214, .2); color: #dfe4ff; }

    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .chev { display: inline-block; transition: transform .2s; color: var(--faint); font-size: 10px; }
    details[open] .chev { transform: rotate(90deg); }
    .divide > * + * { border-top: 1px solid var(--line); }

    body.modal-open { overflow: hidden; }
    header.top { background: rgba(11, 17, 32, .78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen pb-16">

  <header class="top border-b sticky top-0 z-30" style="border-color: var(--line)">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <img src="favicon.svg" alt="" width="38" height="38" class="rounded-[10px] flex-none">
        <div class="min-w-0">
          <div class="eyebrow">諸神降臨・瑪奇 Mobile</div>
          <h1 class="text-base md:text-xl font-bold text-slate-100 leading-tight truncate">公會船・第二階段認領看板</h1>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-none">
        <span id="sync-status" class="hidden md:inline text-xs faint nowrap num mr-1">載入中…</span>
        <button data-act="refresh" id="refresh-btn" aria-label="重新整理" class="btn btn-ghost px-3 py-2 nowrap">↻<span class="hidden sm:inline"> 重新整理</span></button>
        <button data-act="open-modal" class="btn btn-primary px-3 md:px-4 py-2 nowrap">公告<span class="hidden sm:inline">文字</span></button>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4">
    <div id="sync-status-m" class="md:hidden text-[11px] faint num mt-2 text-right"></div>
    <div id="demo-banner" class="hidden mt-3">
      <div class="sub px-3.5 py-2.5 text-xs md:text-sm flex flex-wrap items-center justify-between gap-2" style="border-color: rgba(214,170,100,.3)">
        <span class="text-amber-100/80">示範模式：還沒連上公會資料，名單是假資料，修改只會存在這台裝置。</span>
        <button data-act="demo-reset" class="btn btn-ghost btn-sm nowrap">重設示範資料</button>
      </div>
    </div>
    <div id="error-banner" class="hidden mt-3">
      <div class="sub px-3.5 py-2.5 text-sm flex flex-wrap items-center justify-between gap-2" style="border-color: rgba(220,120,120,.35)">
        <span id="error-text" class="text-rose-200/90"></span>
        <button data-act="refresh" class="btn btn-ghost btn-sm nowrap">重試</button>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 mt-4 md:mt-6 space-y-8 md:space-y-10">

    <section id="mine" class="card p-4 md:p-6">
      <div class="muted text-sm">載入中…</div>
    </section>

    <section>
      <div class="flex items-end justify-between gap-2 mb-3">
        <div>
          <h2 class="sec-title">認領進度</h2>
          <p class="text-xs faint mt-0.5">數字為「已認領 / 目標」・施工順序 2-1 → 2-2 → 2-3 → 2-4，建議由 2-1 開始</p>
        </div>
      </div>
      <div id="stages" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3"></div>
    </section>

    <section>
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-3">
        <h2 class="sec-title">分組認領狀況</h2>
        <div id="filters" class="flex flex-wrap gap-1 p-1 rounded-xl self-start sub"></div>
      </div>
      <div id="groups" class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-5 items-start"></div>
    </section>

    <section class="card p-4 md:p-6">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <h2 class="sec-title">認領名單 <span id="roster-count" class="text-sm font-normal faint"></span></h2>
        <input id="roster-search" type="search" placeholder="搜尋 ID" maxlength="20" class="field px-3 py-1.5 text-sm w-40">
      </div>
      <div id="roster" class="space-y-5"></div>
    </section>

    <footer class="text-center text-xs faint pt-2">諸神降臨 公會 ・ 先認領再備料，避免重複準備</footer>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-3 md:p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="card max-w-2xl w-full p-4 md:p-6 flex flex-col gap-3 max-h-[92vh]" style="background:#121a2c">
      <div class="flex items-center justify-between gap-2">
        <h3 id="modal-title" class="text-base md:text-lg font-bold text-slate-100">群組公告文字</h3>
        <button data-act="close-modal" aria-label="關閉" class="btn btn-ghost w-9 h-9 text-lg leading-none">&times;</button>
      </div>
      <p class="text-xs faint">「建議每人」是把目標平分給該組的建議人數；加入的人比建議人數多時，改用實際人數平分。可直接貼到 Discord / LINE。</p>
      <textarea id="announce-text" readonly class="field w-full flex-1 min-h-[40vh] p-3 text-xs md:text-sm font-mono resize-none leading-relaxed"></textarea>
      <div class="flex justify-end gap-2">
        <button data-act="close-modal" class="btn btn-ghost px-4 py-2">關閉</button>
        <button data-act="copy" id="copy-btn" class="btn btn-primary px-5 py-2">複製公告</button>
      </div>
    </div>
  </div>

<script>
/* =====================================================================
 * ① 後端網址（Apps Script 網頁應用程式）。留空 = 示範模式。
 * ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyDQFep7cVt_zk6xg5iZANYKStYSf2hVRh1LfPd6FFjEuZ0PrFPoybDNP2MUl7xsMAnLA/exec';
const REFRESH_MS = 45000;

/* =====================================================================
 * ② 遊戲資料設定（要改數字只改這裡）
 *    - stages ：各階段交付品與數量（qty = 全公會總數）
 *    - items  ：交付品屬於哪一組、說明（tip = 額外提醒）
 *    - recipes：加工配方（每批）；網頁會自動往下拆出每人要準備的原料
 *               time 可留空，留空就不顯示
 *    - groups ：組別資訊、建議人數（plannedMembers；建議每人 = 目標 ÷ max(建議人數, 實際認領人數)）
 *    ⚠️ items 的 key（例如 wood_plus）與階段 id（例如 2-1）已存進試算表，請勿改名。
 * ===================================================================== */
const CONFIG = {
  guildName: '諸神降臨',

  // 原料單位（沒列的預設「個」）
  rawUnits: { '長莖稈': '根' },

  notes: {
    beeswax: '瓦爾特（杜巴頓）、康納（庫漢）、吉爾摩（班克爾）雜貨店各自每角色每週限購 30 個，需生活力 7,000。'
  },

  stages: [
    { id: '2-1', name: '船體外壁完成', label: 'STEP 1', color: 'emerald',
      needs: [ { item: 'wood_plus', qty: 3000 }, { item: 'alloy_steel', qty: 900 }, { item: 'tar', qty: 1000 } ] },
    { id: '2-2', name: '營火安裝', label: 'STEP 2', color: 'amber',
      needs: [ { item: 'alloy_steel', qty: 1080 }, { item: 'high_wood', qty: 1080 }, { item: 'glue', qty: 1000 } ] },
    { id: '2-3', name: '多面船帆安裝', label: 'STEP 3', color: 'blue',
      needs: [ { item: 'hard_wood', qty: 420 }, { item: 'thick_cloth', qty: 800 }, { item: 'rope', qty: 500 } ] },
    { id: '2-4', name: '外部塗裝及收尾', label: 'STEP 4', color: 'purple',
      needs: [ { item: 'mana_detonator', qty: 500 }, { item: 'tar', qty: 1000 }, { item: 'mushroom_juice', qty: 3000 } ] }
  ],

  items: {
    wood_plus:      { name: '木材+',       group: 'A', unit: '個', note: '原木 → 木材 → 木材+，2-1 用量最大，請優先交付' },
    high_wood:      { name: '高級木材',     group: 'A', unit: '個', note: '木材+ 再加工而成，會用掉木材+' },
    hard_wood:      { name: '堅硬木材',     group: 'A', unit: '個', note: '加工鏈最長：木材 → 木材+ → 高級木材 → 高級木材+ → 堅硬木材，請提早開工' },
    alloy_steel:    { name: '合金鋼錠',     group: 'B', unit: '個', note: '鐵礦石 → 鐵錠 → 鋼錠 → 合金鋼錠；2-1 交 900、2-2 交 1,080' },
    tar:            { name: '焦油',         group: 'B', unit: '個', note: '2-1、2-4 各交 1,000' },
    glue:           { name: '膠水',         group: 'C', unit: '個', note: '高級生皮 + 裝水的瓶子' },
    thick_cloth:    { name: '厚布料',       group: 'C', unit: '個', note: '厚實羊毛 + 高級羊毛 + 蜂蠟', tip: 'beeswax' },
    rope:           { name: '繩索',         group: 'C', unit: '個', note: '長莖稈 → 植物纖維 → 繩索，都在布料加工設備 Lv.3', tip: 'beeswax' },
    mana_detonator: { name: '魔力起爆劑',   group: 'D', unit: '個', note: '蘊含魔力的石頭 + 魔力藥草 + 閃閃發亮的苔蘚' },
    mushroom_juice: { name: '壯壯蘑菇汁液', group: 'D', unit: '個', note: '壯壯蘑菇孢子 + 裝水的瓶子' }
  },

  // 配方（每批）：out = 每批產出數；in = 每批投入；未列配方的就是底層原料
  recipes: {
    '鐵錠':         { out: 3,  in: { '鐵礦石': 10 }, station: '金屬加工設備 Lv.1' },
    '鋼錠':         { out: 3,  in: { '鐵錠': 3, '煤炭': 4 }, station: '金屬加工設備 Lv.1' },
    '合金鋼錠':     { out: 3,  in: { '鋼錠': 3, '銅礦石': 15, '煤炭': 8 }, station: '金屬加工設備 Lv.2' },
    '焦油':         { out: 5,  in: { '原木': 50, '黏土': 25 }, station: '金屬加工設備 Lv.2' },
    '木材':         { out: 3,  in: { '原木': 10 }, station: '木材加工設備 Lv.1' },
    '木材+':        { out: 3,  in: { '木材': 3, '樹液': 4 }, station: '木材加工設備 Lv.1' },
    '高級木材':     { out: 3,  in: { '木材+': 3, '高級原木': 15, '樹液': 8 }, station: '木材加工設備 Lv.2' },
    '高級木材+':    { out: 3,  in: { '高級木材': 4, '高級原木+': 20, '樹液': 12 }, station: '木材加工設備 Lv.3' },
    '堅硬木材':     { out: 3,  in: { '高級木材+': 15, '堅硬原木': 30, '樹液': 30 }, station: '木材加工設備 Lv.3' },
    '膠水':         { out: 5,  in: { '高級生皮': 30, '裝水的瓶子': 10 }, station: '藥品加工設備 Lv.2' },
    '厚布料':       { out: 3,  in: { '厚實羊毛': 50, '高級羊毛': 100, '蜂蠟': 2 }, station: '布料加工設備 Lv.2', time: '1 小時 30 分' },
    '植物纖維':     { out: 10, in: { '長莖稈': 150 }, station: '布料加工設備 Lv.3' },
    '繩索':         { out: 3,  in: { '植物纖維': 45, '蜂蠟': 4 }, station: '布料加工設備 Lv.3' },
    '魔力起爆劑':   { out: 10, in: { '蘊含魔力的石頭': 50, '魔力藥草': 50, '閃閃發亮的苔蘚': 25 }, station: '藥品加工設備 Lv.3' },
    '壯壯蘑菇汁液': { out: 5,  in: { '壯壯蘑菇孢子': 10, '裝水的瓶子': 1 }, station: '藥品加工設備 Lv.1' }
  },

  groups: [
    { id: 'A', name: '伐木建材隊', icon: '🌲', color: 'emerald', plannedMembers: 9,
      tagline: '負責 2-1 木材+、2-2 高級木材、2-3 堅硬木材，是全船用量最大的一組' },
    { id: 'B', name: '鋼鐵焦油隊', icon: '⛏️', color: 'amber', plannedMembers: 8,
      tagline: '負責 2-1、2-2 的合金鋼錠，以及 2-1、2-4 的焦油' },
    { id: 'C', name: '紡織製革隊', icon: '🐑', color: 'blue', plannedMembers: 7,
      tagline: '負責 2-2 膠水，以及 2-3 的厚布料與繩索', tip: 'beeswax' },
    { id: 'D', name: '蘑菇煉金隊', icon: '🍄', color: 'purple', plannedMembers: 6,
      tagline: '負責最後 2-4 的魔力起爆劑與壯壯蘑菇汁液' }
  ]
};
/* ======================== 以下為程式，一般不需修改 ======================== */

const MAX_ID_LEN = 20;
const LS_ME = 'mmship2_me_id';
const LS_DEMO = 'mmship2_demo_db';

// 柔和的強調色（不刺眼）
const ACCENT = { emerald: '#74b89c', amber: '#d3ab6c', blue: '#82a8d9', purple: '#ab97d6' };
const acStyle = color => `style="--ac:${ACCENT[color] || '#94a3b8'}"`;
const noteText = k => (k && CONFIG.notes[k]) || '';
const DEMO = !API_URL;
const state = {
  members: [],          // [{id, group, reports:{'2-1:wood_plus':300}, updatedAt}]
  loaded: false,
  loading: false,
  saving: false,
  lastSync: null,
  error: '',
  filter: 'ALL',
  meId: localStorage.getItem(LS_ME) || '',
  draft: {},            // 我的認領量草稿
  dirty: false,
  showAll: false,
  flash: '',
  openDet: new Set()   // 記住展開中的區塊，自動更新時不會收起
};

/* ---------- 小工具 ---------- */
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('zh-TW');
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
}
const groupById = id => CONFIG.groups.find(g => g.id === id);
const key = (stageId, itemId) => `${stageId}:${itemId}`;
function cleanId(raw) {
  const id = String(raw || '').replace(/[\u0000-\u001F\u007F]/g, '').trim();
  if (!id) return { error: '請輸入遊戲 ID' };
  if (id.length > MAX_ID_LEN) return { error: `遊戲 ID 最多 ${MAX_ID_LEN} 個字` };
  if (/^[=+\-@]/.test(id)) return { error: '遊戲 ID 不能以 = + - @ 開頭' };
  return { id };
}
function timeText(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const pct = (a, b) => b > 0 ? Math.min(100, Math.floor(a / b * 100)) : 0;

/* 依配方把交付品往下拆成「加工批數」與「底層原料」（不計大成功）。
 * needs = { '合金鋼錠': 900, ... }，回傳 { crafts: {產物: 批數}, raw: {原料: 數量} } */
function expandNeeds(needs) {
  const R = CONFIG.recipes;
  const need = { ...needs };
  const crafts = {};
  for (let guard = 0; guard < 100; guard++) {
    const pending = Object.keys(need).filter(p => R[p] && need[p] > 0);
    // 先處理「沒有被其他待處理產物當作原料」的產物（由上往下拆，與 calc.py 相同）
    const p = pending.find(x => !pending.some(q => q !== x && R[q].in[x]));
    if (!p) break;
    const batches = Math.ceil(need[p] / R[p].out);
    crafts[p] = batches;
    for (const [k, v] of Object.entries(R[p].in)) need[k] = (need[k] || 0) + v * batches;
    delete need[p];
  }
  const raw = {};
  for (const [k, v] of Object.entries(need)) if (v > 0 && !R[k]) raw[k] = v;
  return { crafts, raw };
}
// 某交付品的加工鏈上用到的所有配方名稱
function chainOf(name, out = []) {
  const r = CONFIG.recipes[name];
  if (!r || out.includes(name)) return out;
  out.push(name);
  Object.keys(r.in).forEach(k => chainOf(k, out));
  return out;
}

/* ---------- 計算 ---------- */
function computed() {
  const totals = {};
  const claimed = { A: [], B: [], C: [], D: [] };
  for (const m of state.members) {
    if (claimed[m.group]) claimed[m.group].push(m);
    for (const [k, v] of Object.entries(m.reports || {})) totals[k] = (totals[k] || 0) + (Number(v) || 0);
  }
  // 分攤人數：建議人數與實際認領人數取較多者（人少時不會把整份目標壓在一兩個人身上）
  const heads = {};
  for (const g of CONFIG.groups) {
    const n = claimed[g.id].length;
    heads[g.id] = { n: Math.max(g.plannedMembers, n), claimed: n };
  }
  const stages = CONFIG.stages.map(s => {
    let got = 0, need = 0;
    const rows = s.needs.map(nd => {
      const item = CONFIG.items[nd.item];
      const have = totals[key(s.id, nd.item)] || 0;
      got += Math.min(have, nd.qty); need += nd.qty;
      return { ...nd, item, itemId: nd.item, have, gap: Math.max(0, nd.qty - have), over: Math.max(0, have - nd.qty), quota: Math.ceil(nd.qty / heads[item.group].n), pct: pct(have, nd.qty) };
    });
    return { ...s, rows, pct: pct(got, need), done: got >= need };
  });
  const current = stages.find(s => !s.done);
  return { totals, claimed, heads, stages, currentId: current ? current.id : null };
}

async function apiGet() {
  if (DEMO) { await new Promise(r => setTimeout(r, 150)); return { ok: true, members: demoDb() }; }
  const res = await fetch(`${API_URL}${API_URL.includes('?') ? '&' : '?'}t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
  if (!res.ok) throw new Error(`伺服器回應 ${res.status}`);
  return res.json();
}

async function apiPost(body) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 200));
    const db = demoDb();
    const lower = body.id.toLowerCase();
    let i = db.findIndex(m => m.id.toLowerCase() === lower);
    if (body.action === 'delete') { if (i >= 0) db.splice(i, 1); }
    else {
      if (i < 0) { db.push({ id: body.id, group: '', reports: {}, updatedAt: '' }); i = db.length - 1; }
      const m = db[i];
      if ('group' in body) m.group = body.group;
      if (body.reports) for (const [k, v] of Object.entries(body.reports)) { if (v > 0) m.reports[k] = v; else delete m.reports[k]; }
      m.updatedAt = new Date().toISOString();
    }
    localStorage.setItem(LS_DEMO, JSON.stringify(db));
    return { ok: true, members: db };
  }
  // text/plain = 「簡單請求」，不會觸發 CORS 預檢；Apps Script 會 302 轉址，fetch 會自動跟隨
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`伺服器回應 ${res.status}`);
  return res.json();
}

function acceptData(data) {
  if (!data || !data.ok) throw new Error((data && data.error) || '資料格式錯誤');
  state.members = (data.members || []).filter(m => m && m.id).map(m => ({
    id: String(m.id), group: ['A', 'B', 'C', 'D'].includes(m.group) ? m.group : '',
    reports: m.reports && typeof m.reports === 'object' ? m.reports : {}, updatedAt: m.updatedAt || ''
  }));
  state.loaded = true; state.error = ''; state.lastSync = new Date();
}

async function refresh() {
  if (state.loading || state.saving) return;
  state.loading = true; renderStatus();
  try { acceptData(await apiGet()); }
  catch (e) { state.error = `讀不到公會資料，請檢查網路後按「重試」。（${e.message || e}）`; }
  state.loading = false;
  renderAll();
}

async function save(body, okMsg) {
  state.saving = true; state.flash = ''; renderStatus(); renderMine();
  try {
    acceptData(await apiPost(body));
    state.dirty = false; state.flash = okMsg || '✅ 已儲存';
  } catch (e) {
    state.flash = `❌ 儲存失敗，請再試一次（${e.message || e}）`;
  }
  state.saving = false;
  renderAll();
}

function claimChip(have, qty) {
  if (have > qty) return `<span class="chip chip-warn nowrap num">超出 ${fmt(have - qty)}</span>`;
  if (have >= qty) return '<span class="chip chip-ok nowrap">已認領完畢</span>';
  return `<span class="chip nowrap num">還缺 ${fmt(qty - have)}</span>`;
}
// 我的列：別人已認領量（扣掉我已儲存的）
function othersOf(k) {
  const me = myRecord();
  const total = state.members.reduce((a, m) => a + (Number(m.reports[k]) || 0), 0);
  return total - (me ? Number(me.reports[k]) || 0 : 0);

function myGapHtml(k, qty) {

// 原料單位（沒列的預設「個」）
const unitOf = name => (CONFIG.rawUnits && CONFIG.rawUnits[name]) || '個';

// 做法：由基礎原料往上，一步一行「投入 → 產出」（每做一次）
function recipeSteps(name) {
  return chainOf(name).reverse().map(p => {
    const rc = CONFIG.recipes[p];
    return { text: `${Object.entries(rc.in).map(([k, v]) => `${k} ${fmt(v)}`).join(' + ')} → ${p} ${rc.out}`,
             where: `${rc.station}${rc.time ? '・' + rc.time : ''}` };
  });
}
// 原料依「做法」出現的順序排列（基礎原料在前）
function sortedRaw(name, amount) {
  const { raw } = expandNeeds({ [name]: amount });
  const order = [];
  chainOf(name).reverse().forEach(p => Object.keys(CONFIG.recipes[p].in).forEach(k => { if (!order.includes(k)) order.push(k); }));
  return Object.fromEntries(Object.entries(raw).sort((x, y) => order.indexOf(x[0]) - order.indexOf(y[0])));
}
const rawList = raw => Object.entries(raw).map(([k, v]) => `${k} 約 ${fmt(v)} ${unitOf(k)}`);

// 原料區塊。pledge：我的區塊傳入自己的認領量（>0 用它，否則用建議每人）；分組卡片不傳，固定用建議每人
function rowDetails(s, r, h, pledge) {
  const mine = pledge != null ? Number(pledge) || 0 : 0;
  const amount = mine > 0 ? mine : r.quota;
  const raw = sortedRaw(r.item.name, amount);
  const guild = sortedRaw(r.item.name, r.qty);
  const id = `row-${s.id}-${r.itemId}${pledge != null ? '-mine' : ''}`;
  const title = mine > 0
    ? `你認領的 ${fmt(amount)} ${r.item.unit}${r.item.name}，大約需要：`
    : `建議每人做 ${fmt(amount)} ${r.item.unit}${r.item.name}，大約需要：`;
  const steps = recipeSteps(r.item.name);
  return `<details data-det="${id}" ${state.openDet.has(id) ? 'open' : ''} class="mt-3 pt-2.5 border-t w-full" style="border-color:var(--line)">
    <summary class="text-xs font-medium muted flex items-center gap-1.5"><span class="chev">▶</span> 需要哪些原料？</summary>
    <div class="mt-2 text-xs">
      <div class="text-slate-300 font-medium">${esc(title)}</div>
      <ul class="mt-1.5 space-y-1">${Object.entries(raw).map(([n, v]) => `<li class="flex justify-between gap-2">
        <span class="text-slate-300">${esc(n)}</span><span class="nowrap num text-slate-100"><span class="faint">約</span> <b class="font-semibold">${fmt(v)}</b> <span class="muted">${esc(unitOf(n))}</span></span></li>`).join('')}</ul>
      <div class="mt-3 text-[11px] text-slate-300">做法（每做一次）：</div>
      <ol class="mt-1 space-y-1">${steps.map((st, i) => `<li class="text-[11px] muted leading-relaxed"><span class="faint num">${i + 1}.</span> ${esc(st.text)} <span class="faint nowrap">（${esc(st.where)}）</span></li>`).join('')}</ol>
      <div class="mt-2.5 text-[11px] faint leading-relaxed">全公會總共需要（目標 ${fmt(r.qty)}）：${esc(rawList(guild).join('、'))}</div>
    </div>
  </details>`;
}

function renderGroups() {
  const c = computed();
  const list = state.filter === 'ALL' ? CONFIG.groups : CONFIG.groups.filter(g => g.id === state.filter);
  $('groups').innerHTML = list.map(g => {
    const h = c.heads[g.id];
    const members = c.claimed[g.id];
    const itemIds = Object.keys(CONFIG.items).filter(id => CONFIG.items[id].group === g.id);

    const tasks = c.stages.map(s => s.rows.filter(r => r.item.group === g.id).map(r => `
      <div class="sub ${r.have >= r.qty ? 'done' : ''} p-3.5" ${acStyle(s.color)}>
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 text-[11px] font-bold"><span class="ac-dot"></span><span class="ac-text nowrap">${esc(s.id)} ${esc(s.name)}</span>${s.id === c.currentId ? '<span class="faint font-medium">・目前優先</span>' : ''}</div>
            <div class="flex items-center gap-2 flex-wrap mt-1"><h4 class="text-base md:text-lg font-bold text-slate-100">${esc(r.item.name)}</h4>${claimChip(r.have, r.qty)}</div>
          </div>
          <div class="text-right flex-none">
            <div class="text-[11px] faint nowrap">建議每人</div>
            <div class="text-xl font-bold num text-slate-100 leading-tight">${fmt(r.quota)}<span class="text-xs muted font-normal ml-0.5">${esc(r.item.unit)}</span></div>
          </div>
        </div>
        <div class="flex justify-between text-xs muted mt-2.5 num"><span>已認領 <b class="text-slate-200 font-semibold">${fmt(r.have)}</b> / 目標 ${fmt(r.qty)}</span><span>${r.pct}%</span></div>
        <div class="mt-1.5">${bar(r.pct)}</div>
        ${rowDetails(s, r, h)}
      </div>`).join('')).join('');

    const chips = members.length
      ? members.map(m => `<span class="chip break-all">${esc(m.id)}</span>`).join('')
      : '<span class="text-xs faint">還沒有人加入，歡迎當第一個！</span>';

    return `<article class="card overflow-hidden flex flex-col" ${acStyle(g.color)}>
      <div class="group-head p-4 md:p-5 border-b" style="border-color:var(--line)">
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="text-2xl leading-none">${g.icon}</span>
            <div class="min-w-0">
              <div class="eyebrow ac-text">${g.id} 組</div>
              <h3 class="text-lg font-bold text-slate-100 leading-tight">${esc(g.name)}</h3>
            </div>
          </div>
          <span class="chip chip-ac nowrap num">已加入 ${members.length} 人・建議 ${g.plannedMembers} 人</span>
        </div>
        <p class="text-xs md:text-sm muted mt-2.5">${esc(g.tagline)}</p>
        <div class="mt-3 flex flex-wrap gap-1.5">${chips}</div>
      </div>
      <div class="p-4 md:p-5 space-y-3 flex-1">
        ${g.tip ? tipBox(g.tip) : ''}
        ${tasks}
      </div>
    </article>`;
  }).join('');
}

/* ---------- 畫面：名單 ---------- */
function renderRoster() {
  const q = $('roster-search').value.trim().toLowerCase();
  const list = state.members.filter(m => !q || m.id.toLowerCase().includes(q));
  $('roster-count').textContent = `${state.members.length} 人`;
  const sections = [...CONFIG.groups.map(g => ({ id: g.id, title: `${g.icon} ${g.id} 組・${g.name}`, color: g.color })), { id: '', title: '還沒選組別', color: null }];
  const html = sections.map(sec => {
    const ms = list.filter(m => m.group === sec.id).sort((a, b) => a.id.localeCompare(b.id, 'zh-TW'));
    if (!ms.length) return '';
    return `<div ${sec.color ? acStyle(sec.color) : ''}>
      <div class="flex items-center gap-2 text-sm font-bold mb-2">${sec.color ? '<span class="ac-dot"></span>' : ''}<span class="${sec.color ? 'ac-text' : 'muted'}">${esc(sec.title)}</span><span class="faint font-normal num">${ms.length}</span></div>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">${ms.map(m => {
        const entries = CONFIG.stages.flatMap(s => s.needs.map(n => [s, n])).filter(([s, n]) => m.reports[key(s.id, n.item)] > 0);
        const chips = entries.length ? '<span class="faint">認領：</span>' + entries.map(([s, n]) => `<span class="nowrap">${esc(s.id)} ${esc(CONFIG.items[n.item].name)} <b class="text-slate-200 font-semibold num">${fmt(m.reports[key(s.id, n.item)])}</b></span>`).join('<span class="faint">・</span>') : '<span class="faint">還沒填認領數量</span>';
        const isMe = state.meId && m.id.toLowerCase() === state.meId.toLowerCase();
        return `<div class="sub px-3 py-2.5" ${isMe ? 'style="border-color: rgba(109,127,214,.45)"' : ''}>
          <div class="flex justify-between gap-2"><span class="font-bold text-slate-100 break-all">${esc(m.id)}${isMe ? ' <span class="text-xs font-medium text-indigo-200/80">（我）</span>' : ''}</span><span class="text-[11px] faint nowrap num">${esc(timeText(m.updatedAt))}</span></div>
          <div class="text-xs muted mt-1 flex flex-wrap gap-x-1 leading-relaxed">${chips}</div>
        </div>`;
      }).join('')}</div></div>`;
  }).join('');
  $('roster').innerHTML = html || `<p class="text-sm muted">${q ? '找不到符合的 ID' : (state.loaded ? '還沒有人認領，成為第一個吧！' : '載入中…')}</p>`;
}

function renderAll() {
  syncDraft();
  renderStatus(); renderMine(); renderStages(); renderFilters(); renderGroups(); renderRoster();
}

/* ---------- 公告 ---------- */
function buildAnnouncement() {
  const c = computed();
  const L = [];
  const total = state.members.filter(m => m.group).length;
  L.push(`🚢【${CONFIG.guildName}】公會船第二階段・分組認領（目前 ${total} 人已加入組別）`);
  L.push('為避免重複備料，開始準備前請先到看板認領組別並填寫「我認領的數量」：');
  L.push(location.href.split('#')[0]);
  L.push('');
  L.push('▍認領進度');
  c.stages.forEach(s => L.push(`  ${s.id} ${s.name}：已認領 ${s.pct}%${s.done ? ' ✅' : s.id === c.currentId ? '（目前優先）' : ''}`));
  L.push('');
  CONFIG.groups.forEach(g => {
    const h = c.heads[g.id];
    L.push(`${g.icon}【${g.id} 組・${g.name}】已加入 ${h.claimed} 人（建議 ${g.plannedMembers} 人）`);
    c.stages.forEach(s => s.rows.filter(r => r.item.group === g.id).forEach(r => {
      L.push(`  • [${s.id}] ${r.item.name}：已認領 ${fmt(r.have)} / 目標 ${fmt(r.qty)}，${r.over ? `超出 ${fmt(r.over)} 個，可以少準備一些` : r.gap ? `還有 ${fmt(r.gap)} 個沒人認領` : '已全部認領完畢 ✅'}`);
      if (r.gap > 0) {
        const n = Math.min(r.quota, r.gap);
        L.push(`      ${r.gap < r.quota ? `剩下的 ${fmt(n)} 個` : `建議每人 ${fmt(n)} 個`}，需要：${rawList(sortedRaw(r.item.name, n)).join('、')}`);
      }
    }));
    L.push('');
  });
  const allNeeds = {};
  CONFIG.stages.forEach(st => st.needs.forEach(n => { const nm = CONFIG.items[n.item].name; allNeeds[nm] = (allNeeds[nm] || 0) + n.qty; }));
  const wax = expandNeeds(allNeeds).raw['蜂蠟'] || 0;
  L.push('▍提醒');
  const curStage = c.stages.find(st => st.id === c.currentId);
  L.push(curStage
    ? `1. 施工順序 2-1 → 2-2 → 2-3 → 2-4。目前優先：${curStage.id} ${curStage.name}，請先認領這一階段還缺的材料。`
    : '1. 四個階段都已認領完畢，大家照自己認領的數量準備就好！');
  L.push(`2. 厚布料、繩索共需蜂蠟約 ${fmt(wax)} 個。${CONFIG.notes.beeswax}請大家每週買滿，支援 C 組！`);
  L.push('3. 先認領再備料！已認領完畢的項目就不用再準備；做不完時請回看板把數字改小，讓別人接手。');
  return L.join('\n');
}
let lastFocus = null;
function openModal() {
  lastFocus = document.activeElement;
  $('announce-text').value = buildAnnouncement();
  $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
  document.body.classList.add('modal-open');
  $('copy-btn').focus();
}
function closeModal() {
  $('modal').classList.add('hidden'); $('modal').classList.remove('flex');
  document.body.classList.remove('modal-open');
  if (lastFocus) lastFocus.focus();
}
async function copyAnnouncement() {
  const ta = $('announce-text'); const btn = $('copy-btn');
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.select(); try { document.execCommand('copy'); } catch (e2) {} }
  btn.textContent = '已複製 ✓';
  setTimeout(() => { btn.textContent = '複製公告'; }, 2000);
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target === $('modal')) closeModal();   // 點背景關閉
    return;
  }
  const act = el.dataset.act;
  if (act === 'open-modal') openModal();
  else if (act === 'close-modal') closeModal();
  else if (act === 'copy') copyAnnouncement();
  else if (act === 'refresh') refresh();
  else if (act === 'filter') { state.filter = el.dataset.filter; renderFilters(); renderGroups(); }
  else if (act === 'claim') {
    if (state.saving) return;
    const gid = el.dataset.group;
    const me = myRecord();
    if (me && me.group === gid) return;
    if (gid === '' && !confirm('確定要退出這一組嗎？（已填的認領數量會保留）')) return;
    save({ action: 'upsert', id: state.meId, group: gid }, gid ? `✅ 已加入 ${gid} 組` : '已退出組別');
  }
  else if (act === 'fill' || act === 'zero') {
    const k = el.dataset.key;
    // 填入缺口：建議每人 與 剩餘缺口（目標 − 別人已認領）取較小者
    state.draft[k] = act === 'fill' ? Math.max(0, Math.min(Number(el.dataset.quota), Number(el.dataset.qty) - othersOf(k))) : 0;
    state.dirty = true; state.flash = ''; renderMine();
  }
  else if (act === 'save') {
    if (state.saving) return;
    const reports = {};
    for (const s of CONFIG.stages) for (const n of s.needs) {
      const k = key(s.id, n.item);
      const v = Number(state.draft[k] || 0);
      if (!Number.isInteger(v) || v < 0 || v > 1000000) { state.flash = '❌ 數量請填 0～1,000,000 的整數'; renderMine(); return; }
      reports[k] = v;
    }
    save({ action: 'upsert', id: state.meId, reports }, '✅ 認領已儲存');
  }
  else if (act === 'switch-id') {
    if (state.dirty && !confirm('你有還沒儲存的數量，確定要切換 ID 嗎？')) return;
    state.meId = ''; localStorage.removeItem(LS_ME); state.dirty = false; state.flash = ''; renderAll();
  }
  else if (act === 'delete-me') {
    if (!confirm(`確定要刪除「${state.meId}」的認領紀錄嗎？此動作無法復原。`)) return;
    state.dirty = false;
    save({ action: 'delete', id: state.meId }, '已刪除紀錄');
  }
  else if (act === 'demo-reset') {
    if (!confirm('重設示範資料？')) return;
    localStorage.removeItem(LS_DEMO); state.dirty = false; refresh();
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('[data-act=show-all]')) { state.showAll = e.target.checked; renderMine(); }
  else if (e.target.matches('#mine input[type=number]')) {
    // 失焦或按 Enter 後才重繪
    setTimeout(renderMine, 0);
  }
});

document.addEventListener('input', e => {
  if (e.target.matches('#mine input[type=number]')) {
    const raw = e.target.value;
    let v = raw === '' ? 0 : Math.floor(Number(raw));
    if (!isFinite(v) || v < 0) v = 0;
    if (v > 1000000) v = 1000000;
    const k = e.target.dataset.key;
    state.draft[k] = v;
    state.dirty = true; state.flash = '';
    // 即時更新「還缺」提示，不重繪整區（避免打字中斷）
    const g = document.querySelector(`[data-gap="${k}"]`);
    if (g) g.innerHTML = myGapHtml(k, Number(g.dataset.qty));
    const b = document.querySelector(`[data-gapbar="${k}"]`);
    if (b && g) b.style.width = pct(Math.min(Number(g.dataset.qty), othersOf(k) + v), Number(g.dataset.qty)) + '%';
  } else if (e.target.id === 'roster-search') renderRoster();
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'id-form') return;
  e.preventDefault();
  const r = cleanId($('id-input').value);
  if (r.error) { $('id-error').textContent = r.error; return; }
  // 若名單中已有同名（大小寫不同），沿用名單上的寫法
  const exist = state.members.find(m => m.id.toLowerCase() === r.id.toLowerCase());
  state.meId = exist ? exist.id : r.id;
  localStorage.setItem(LS_ME, state.meId);
  state.dirty = false; state.flash = exist ? `歡迎回來，${state.meId}！` : '';
  renderAll();
});

document.addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.det;
  if (id) { if (e.target.open) state.openDet.add(id); else state.openDet.delete(id); }
}, true);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal();
});

window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

// 自動更新：每 45 秒；切到背景暫停，回到前景立即更新
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.lastSync && Date.now() - state.lastSync.getTime() > 15000) refresh();
});

renderAll();
refresh();
</script>
</body>
</html>
